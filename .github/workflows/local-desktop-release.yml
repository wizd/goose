name: Local desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - local-build

permissions:
  contents: write
  id-token: write

concurrency:
  group: local-desktop-release
  cancel-in-progress: false

jobs:
  bump-desktop-version:
    name: Bump local build number
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      ref: ${{ steps.bump.outputs.ref }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute and commit the next desktop version
        id: bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          upstream=$(grep -m1 '^version[[:space:]]*=' Cargo.toml | cut -d'"' -f2)
          desktop=$(node -p "require('./ui/desktop/package.json').version")
          tags=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[].tag_name' | tr '\n' ' ')
          version=$(node scripts/next-desktop-version.mjs --upstream "$upstream" --desktop "$desktop" --tags "$tags")
          VERSION="$version" node --input-type=module <<'EOF'
          import { readFileSync, writeFileSync } from "node:fs";
          const path = "ui/desktop/package.json";
          const version = process.env.VERSION;
          const text = readFileSync(path, "utf8");
          const updated = text.replace(/"version": "[^"]+"/, `"version": "${version}"`);
          if (updated === text) {
            if (!text.includes(`"version": "${version}"`)) {
              throw new Error(`desktop package.json has no version field to set to ${version}`);
            }
            process.exit(0);
          }
          writeFileSync(path, updated);
          EOF
          if git diff --quiet -- ui/desktop/package.json; then
            echo "Desktop version is already ${version}"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ui/desktop/package.json
            git commit -m "chore(desktop): release ${version}"
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              target_branch=my-dev
            else
              target_branch="${GITHUB_REF_NAME}"
            fi
            git push origin "HEAD:${target_branch}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  bundle-macos-arm64:
    name: Bundle macOS arm64
    needs: bump-desktop-version
    permissions:
      contents: read
    uses: ./.github/workflows/bundle-macos.yml
    with:
      target: aarch64-apple-darwin
      package_cli: true
      package_desktop: true
      signing: false
      ref: ${{ needs.bump-desktop-version.outputs.ref }}

  bundle-macos-x64:
    name: Bundle macOS x64
    needs: bump-desktop-version
    permissions:
      contents: read
    uses: ./.github/workflows/bundle-macos.yml
    with:
      target: x86_64-apple-darwin
      package_cli: true
      package_desktop: true
      signing: false
      ref: ${{ needs.bump-desktop-version.outputs.ref }}

  bundle-windows:
    name: Bundle Windows x64
    needs: bump-desktop-version
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/bundle-windows.yml
    with:
      package_cli: true
      package_desktop: true
      signing: false
      ref: ${{ needs.bump-desktop-version.outputs.ref }}

  release:
    name: Publish local desktop release
    needs: [bump-desktop-version, bundle-macos-arm64, bundle-macos-x64, bundle-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download desktop packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: Goose-*
          merge-multiple: true

      - name: Download CLI packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: goose-*
          merge-multiple: true

      - name: Name release packages
        run: |
          set -euo pipefail
          cp Goose-win32-x64.zip Goose-desktop-windows-x64.zip
          cp Goose.zip Goose-desktop-mac-arm64.zip
          cp Goose_intel_mac.zip Goose-desktop-mac-x64.zip
          cp goose-x86_64-pc-windows-msvc.zip goose-cli-windows-x64.zip
          cp goose-aarch64-apple-darwin.tar.gz goose-cli-mac-arm64.tar.gz
          cp goose-x86_64-apple-darwin.tar.gz goose-cli-mac-x64.tar.gz

      - name: Checkout service default files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bump-desktop-version.outputs.ref }}
          path: source
          sparse-checkout: distro/vcorp
          sparse-checkout-cone-mode: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.bump-desktop-version.outputs.version }}
          RELEASE_TARGET: ${{ needs.bump-desktop-version.outputs.ref }}
        run: |
          set -euo pipefail
          notes="Local build ${VERSION}. Windows service defaults are attached as system-config.yaml and install-defaults.ps1. Keep both files in the same folder and run install-defaults.ps1 once. It writes the machine-wide Goose config at PROGRAMDATA/goose/config.yaml. App updates do not replace that file."
          gh release create "desktop-${VERSION}" \
            Goose-desktop-windows-x64.zip \
            Goose-desktop-mac-arm64.zip \
            Goose-desktop-mac-x64.zip \
            goose-cli-windows-x64.zip \
            goose-cli-mac-arm64.tar.gz \
            goose-cli-mac-x64.tar.gz \
            source/distro/vcorp/system-config.yaml \
            source/distro/vcorp/install-defaults.ps1 \
            --repo "${GITHUB_REPOSITORY}" \
            --target "$RELEASE_TARGET" \
            --title "${VERSION}" \
            --notes "$notes"

      - name: Upload packages to the update server
        env:
          VERSION: ${{ needs.bump-desktop-version.outputs.version }}
          GOOSE_UPDATE_HOST: ${{ secrets.GOOSE_UPDATE_HOST }}
          GOOSE_UPDATE_SSH_KEY: ${{ secrets.GOOSE_UPDATE_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${GOOSE_UPDATE_HOST}" ] || [ -z "${GOOSE_UPDATE_SSH_KEY}" ]; then
            echo "GOOSE_UPDATE_HOST or GOOSE_UPDATE_SSH_KEY is unset; skipping the update server upload."
            exit 0
          fi
          install -m 700 -d "${HOME}/.ssh"
          printf '%s\n' "${GOOSE_UPDATE_SSH_KEY}" > "${HOME}/.ssh/goose_update"
          chmod 600 "${HOME}/.ssh/goose_update"
          ssh_opts=(-i "${HOME}/.ssh/goose_update" -o StrictHostKeyChecking=accept-new)
          remote="goose-update@${GOOSE_UPDATE_HOST}"
          dest="/data/goose-updates/goose/${VERSION}"
          base="https://goose-update.vcorp.ai/goose/${VERSION}"
          VERSION="$VERSION" BASE="$base" node --input-type=module <<'EOF'
          import { existsSync, readFileSync, writeFileSync } from "node:fs";
          const version = process.env.VERSION;
          const base = process.env.BASE;
          const manifest = {
            version,
            files: {
              "win32-x64": `${base}/Goose-desktop-windows-x64.zip`,
              "darwin-arm64": `${base}/Goose-desktop-mac-arm64.zip`,
              "darwin-x64": `${base}/Goose-desktop-mac-x64.zip`,
            },
            cli: {
              "win32-x64": `${base}/goose-cli-windows-x64.zip`,
              "darwin-arm64": `${base}/goose-cli-mac-arm64.tar.gz`,
              "darwin-x64": `${base}/goose-cli-mac-x64.tar.gz`,
            },
          };
          for (const name of ["Goose.zip.macos.json", "Goose_intel_mac.zip.macos.json"]) {
            if (!existsSync(name)) continue;
            const minimumMacOSVersion = JSON.parse(readFileSync(name, "utf8")).minimumMacOSVersion;
            if (typeof minimumMacOSVersion === "string") {
              manifest.minimumMacOSVersion = minimumMacOSVersion;
              break;
            }
          }
          writeFileSync("latest.json", JSON.stringify(manifest));
          EOF
          ssh "${ssh_opts[@]}" "$remote" "mkdir -p $(printf '%q' "$dest")"
          rsh="ssh -i ${HOME}/.ssh/goose_update -o StrictHostKeyChecking=accept-new"
          rsync -az --chmod=D755,F644 -e "$rsh" \
            Goose-desktop-windows-x64.zip \
            Goose-desktop-mac-arm64.zip \
            Goose-desktop-mac-x64.zip \
            goose-cli-windows-x64.zip \
            goose-cli-mac-arm64.tar.gz \
            goose-cli-mac-x64.tar.gz \
            "${remote}:${dest}/"
          rsync -az --chmod=F644 -e "$rsh" \
            latest.json \
            "${remote}:/data/goose-updates/goose/latest.json.next"
          ssh "${ssh_opts[@]}" "$remote" "mv -f /data/goose-updates/goose/latest.json.next /data/goose-updates/goose/latest.json"
