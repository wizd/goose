name: Local desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - local-build

permissions:
  contents: write

concurrency:
  group: local-desktop-release
  cancel-in-progress: false

jobs:
  bump-desktop-version:
    name: Bump local build number
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      ref: ${{ steps.bump.outputs.ref }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute and commit the next desktop version
        id: bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          upstream=$(grep -m1 '^version[[:space:]]*=' Cargo.toml | cut -d'"' -f2)
          desktop=$(node -p "require('./ui/desktop/package.json').version")
          tags=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[].tag_name' | tr '\n' ' ')
          version=$(node scripts/next-desktop-version.mjs --upstream "$upstream" --desktop "$desktop" --tags "$tags")
          VERSION="$version" node --input-type=module <<'EOF'
          import { readFileSync, writeFileSync } from "node:fs";
          const path = "ui/desktop/package.json";
          const version = process.env.VERSION;
          const text = readFileSync(path, "utf8");
          const updated = text.replace(/"version": "[^"]+"/, `"version": "${version}"`);
          if (updated === text) {
            throw new Error(`desktop package.json has no version field to set to ${version}`);
          }
          writeFileSync(path, updated);
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/desktop/package.json
          git commit -m "chore(desktop): release ${version}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            target_branch=my-dev
          else
            target_branch="${GITHUB_REF_NAME}"
          fi
          git push origin "HEAD:${target_branch}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  bundle-macos-arm64:
    name: Bundle macOS arm64
    needs: bump-desktop-version
    permissions:
      contents: read
    uses: ./.github/workflows/bundle-macos.yml
    with:
      target: aarch64-apple-darwin
      package_desktop: true
      signing: false
      ref: ${{ needs.bump-desktop-version.outputs.ref }}

  bundle-macos-x64:
    name: Bundle macOS x64
    needs: bump-desktop-version
    permissions:
      contents: read
    uses: ./.github/workflows/bundle-macos.yml
    with:
      target: x86_64-apple-darwin
      package_desktop: true
      signing: false
      ref: ${{ needs.bump-desktop-version.outputs.ref }}

  bundle-windows:
    name: Bundle Windows x64
    needs: bump-desktop-version
    permissions:
      contents: read
    uses: ./.github/workflows/bundle-windows.yml
    with:
      package_desktop: true
      signing: false
      ref: ${{ needs.bump-desktop-version.outputs.ref }}

  release:
    name: Publish local desktop release
    needs: [bump-desktop-version, bundle-macos-arm64, bundle-macos-x64, bundle-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download desktop packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: Goose-*
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.bump-desktop-version.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "desktop-${VERSION}" \
            Goose.zip \
            Goose_intel_mac.zip \
            Goose-win32-x64.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${VERSION}" \
            --notes "Local desktop build ${VERSION}."
